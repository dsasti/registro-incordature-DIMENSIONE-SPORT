<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro Corde — Reparto Tennis</title>
  <link rel="stylesheet" href="/css/style.css?v=2" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link rel="apple-touch-icon" href="/logo.jpg" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🧵 Registro Corde</h1>
      <div class="subtitle">Gestione elenco corde per i menu a tendina</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <a href="/registro.html" class="btn btn-secondary btn-sm" style="text-decoration:none;">📋 Registro</a>
      <a href="/index.html" class="btn btn-secondary btn-sm" style="text-decoration:none;">🏠 Index</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-header">
        <h2>Aggiungi Nuova Corda</h2>
      </div>
      <form id="addStringForm" class="search-box">
        <input
          type="text"
          id="newStringName"
          class="search-input"
          placeholder="es. BABOLAT RPM ROUGH 125"
          required
        />
        <input
          type="number"
          step="0.01"
          min="0"
          id="newStringPrice"
          class="search-input"
          style="max-width:170px;"
          placeholder="Prezzo (€)"
        />
        <button type="submit" class="btn btn-primary">+ Aggiungi Corda</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header" id="toggleCordeListHeader" style="cursor:pointer; user-select:none;">
        <h2><span id="cordeListIcon">▸</span> Corde a Listino (<span id="stringsCount">0</span>)</h2>
      </div>
      <div id="cordeListBody" class="hidden" style="padding-top:12px;">
        <div class="filter-bar" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; align-items:center;">
          <input type="text" id="stringsSearchInput" placeholder="Filtra per nome o prezzo..." style="flex:1; min-width:180px; padding:8px 12px; border-radius:8px; border:1.5px solid var(--border); font-family:inherit;" />
          <select id="stringsSortSelect" style="padding:8px 12px; border-radius:8px; border:1.5px solid var(--border); font-family:inherit;">
            <option value="name_asc">Nome (A → Z)</option>
            <option value="name_desc">Nome (Z → A)</option>
            <option value="price_asc">Prezzo (crescente)</option>
            <option value="price_desc">Prezzo (decrescente)</option>
          </select>
          <button type="button" id="btnToggleEditStrings" class="btn btn-secondary btn-sm">✏️ Modifica Listino</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome Corda</th>
                <th style="width:180px;">Prezzo Incordatura (€)</th>
                <th style="width:160px;">Residuo</th>
                <th style="width:70px;"></th>
              </tr>
            </thead>
            <tbody id="stringsTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <footer style="text-align:center; padding:14px; font-size:0.78rem; color:var(--text-muted);">Dimensione Sport — App v1.12</footer>
  <script src="/js/corde.js"></script>
</body>
</html>
